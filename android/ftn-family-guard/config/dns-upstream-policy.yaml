version: 2

# Family Guard resolver policy.
# No public resolver is hard-blocked. Resolver selection is policy-controlled.
resolver:
  mode: policy-controlled
  preferred: ftn
  public_fallback: false
  direct_public_dns: policy-controlled
  query_external_family_dns: policy-controlled
  require_dnssec: true

resolvers:
  ftn:
    enabled: true
    approved: true
    addresses: []
    transport: policy-controlled
  cloudflare_family:
    enabled: true
    approved: false
    ipv4:
      - 1.1.1.1
      - 1.0.0.1
    ipv6:
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    note: Use only when explicitly enabled by the active resolver policy.

policy:
  resolver_allowlist: []
  allow_public_resolvers: false
  allow_cloudflare_family: false
  allow_ftn_resolvers: true
  prefer_ftn_resolvers: true
  require_health_check: true
  require_dnssec: true

privacy:
  raw_queries_persisted: false
  payload_inspection: false
  external_query_logging: false
  aggregate_usage_only: true

routing:
  prefer_local_policy: true
  fail_closed_for_unapproved_dns: true
  approved_resolvers_runtime: []
  # Real FTN resolver addresses and credentials are provisioned outside Git.

security:
  dnssec_validation: required
  dnssec_failure_action: block_response
  no_hardcoded_public_resolver_block: true

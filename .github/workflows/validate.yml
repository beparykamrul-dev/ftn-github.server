name: FTN Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          for p in pathlib.Path('config').glob('*.yaml'):
              with p.open() as f:
                  yaml.safe_load(f)
              print('OK', p)
          PY
      - name: Check deployment script
        run: bash -n scripts/deploy.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Resolve Go dependencies
        working-directory: backend/family-guard
        run: go mod tidy
      - name: Test Family Guard
        working-directory: backend/family-guard
        run: go test ./...
      - name: Build Family Guard
        working-directory: backend/family-guard
        run: go build ./...
      - name: Build Git Center
        working-directory: backend/git-center
        run: go build -o /tmp/ftn-git-center .
